<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 To Do List</h1>
            <div class="theme-selector">
                <button id="themeBtn">Темы</button>
                <div class="theme-dropdown" id="themeDropdown">
                    <div class="loading">Загрузка...</div>
                </div>
            </div>
        </div>

        <div class="stats">
            <div class="stat-item" id="totalStat">Всего: 0</div>
            <div class="stat-item" id="activeStat">Активных: 0</div>
            <div class="stat-item" id="completedStat">Завершено: 0</div>
        </div>

        <div class="input-group">
            <input type="text" id="input" placeholder="Добавить новую задачу...">
            <button id="addBtn" onclick="add()">Добавить</button>
        </div>

        <ul id="list"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>

<html>
<head>
    <title>TO-DO LIST</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>TO-DO Ліст</h1>
            <div class="header-buttons">
                <button id="achievementsBtn">🏆 Нагороди</button>
                <div class="theme-selector">
                    <button id="themeBtn">Теми</button>
                    <div class="theme-dropdown" id="themeDropdown">
                        <div class="loading">Завантаження...</div>
                    </div>
                </div>
                <div class="theme-selector">
                    <button id="languageBtn">🌐 Мова</button>
                    <div class="theme-dropdown" id="languageDropdown">
                        <div class="loading">Завантаження...</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="achievements-modal" id="achievementsModal">
            <div class="achievements-content">
                <div class="achievements-header">
                    <h2>🏆 Ваші досягнення</h2>
                    <button class="close-btn" id="closeAchievements">×</button>
                </div>
                <div class="achievements-stats">
                    <div class="achievement-stat">
                        <div class="stat-number" id="totalCompleted">0</div>
                        <div class="stat-label">Виконано завдань</div>
                    </div>
                    <div class="achievement-stat">
                        <div class="stat-number" id="totalCreated">0</div>
                        <div class="stat-label">Створено завдань</div>
                    </div>
                    <div class="achievement-stat">
                        <div class="stat-number" id="currentStreak">0</div>
                        <div class="stat-label">Днів поспіль</div>
                    </div>
                </div>
                <div class="achievements-list" id="achievementsList"></div>
            </div>
        </div>

        <div class="stats">
            <div class="stat-item" id="totalStat">Всього: 0</div>
            <div class="stat-item" id="activeStat">Активних: 0</div>
            <div class="stat-item" id="completedStat">Завершено: 0</div>
        </div>

        <div class="input-group">
            <input type="text" id="input" placeholder="Додати нове завдання...">
            <button id="addBtn" onclick="add()">Додати</button>
        </div>

        <ul id="list"></ul>
    </div>

    <div id="notificationContainer"></div>

    <script src="script.js"></script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XH67DWCKLZ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-XH67DWCKLZ');
</script>
</body>
</html>
